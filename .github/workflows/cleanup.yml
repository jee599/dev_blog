name: Cleanup DEV.to articles

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete all unpublished articles
        env:
          DEVTO_KEY: ${{ secrets.DEVTO_TOKEN }}
        run: |
          python3 << 'PYEOF'
          import json, urllib.request, time, os

          KEY = os.environ["DEVTO_KEY"]
          HEADERS = {"api-key": KEY, "Content-Type": "application/json", "User-Agent": "dev-blog-cleanup/1.0", "Accept": "application/vnd.forem.api-v1+json"}

          # Fetch all unpublished articles
          all_articles = []
          page = 1
          while True:
              url = f"https://dev.to/api/articles/me/unpublished?per_page=100&page={page}"
              req = urllib.request.Request(url, headers=HEADERS)
              resp = urllib.request.urlopen(req)
              arts = json.loads(resp.read())
              if not arts:
                  break
              all_articles.extend(arts)
              if len(arts) < 100:
                  break
              page += 1

          print(f"Unpublished articles found: {len(all_articles)}")

          deleted = 0
          failed = 0
          for art in all_articles:
              aid = art["id"]
              title = art.get("title", "")[:60]
              print(f"  Deleting {aid}: {title}...")
              req = urllib.request.Request(
                  f"https://dev.to/api/articles/{aid}",
                  method="DELETE", headers=HEADERS
              )
              try:
                  resp = urllib.request.urlopen(req)
                  print(f"    -> HTTP {resp.status}")
                  deleted += 1
              except Exception as e:
                  print(f"    -> Failed: {e}")
                  failed += 1
              time.sleep(3)

          print(f"\nDone: {deleted} deleted, {failed} failed")
          PYEOF
