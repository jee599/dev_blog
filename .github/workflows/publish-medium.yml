name: Publish to Medium

on:
  push:
    branches: [main]
    paths:
      - 'posts/*-en.md'
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish English posts to Medium
        env:
          MEDIUM_TOKEN: ${{ secrets.MEDIUM_TOKEN }}
        run: |
          python3 << 'PYEOF'
          import os, json, re, glob, time, urllib.request, urllib.error

          token = os.environ.get("MEDIUM_TOKEN", "")
          if not token:
              print("MEDIUM_TOKEN not set, skipping")
              exit(0)

          HEADERS = {
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json",
              "Accept": "application/json",
              "User-Agent": "dev-blog-publisher/1.0",
          }

          # Get user ID
          req = urllib.request.Request("https://api.medium.com/v1/me", headers=HEADERS)
          try:
              resp = urllib.request.urlopen(req)
              user = json.loads(resp.read())["data"]
              user_id = user["id"]
              print(f"Authenticated as: {user['username']}")
          except Exception as e:
              print(f"Auth failed: {e}")
              exit(1)

          published = 0
          skipped = 0

          for filepath in sorted(glob.glob("posts/*-en.md")):
              # Skip build-log posts
              basename = os.path.basename(filepath)
              if "build-log" in basename:
                  print(f"SKIP (build-log): {filepath}")
                  continue

              with open(filepath) as f:
                  content = f.read()

              # Check if already published to Medium
              if "medium_url:" in content:
                  skipped += 1
                  continue

              # Parse frontmatter
              parts = content.split("---", 2)
              if len(parts) < 3:
                  continue

              fm = parts[1]
              body_md = parts[2].strip()

              # Skip short content
              if len(body_md) < 100:
                  continue

              # Extract fields
              m = re.search(r'^title:\s*["\']?(.*?)["\']?\s*$', fm, re.M)
              title = m.group(1).strip() if m else ""
              if not title:
                  continue

              m = re.search(r'^tags:\s*(.*?)$', fm, re.M)
              tags_str = m.group(1).strip() if m else ""
              # Parse tags: "ai, webdev, llm" or [ai, webdev]
              tags = [t.strip().strip("'\"") for t in re.split(r'[,\[\]]', tags_str) if t.strip().strip("'\"")][:3]

              # Check published flag
              m = re.search(r'^published:\s*(true|false)', fm, re.M | re.I)
              if m and m.group(1).lower() != "true":
                  continue

              print(f"\nPUBLISHING to Medium: {title[:60]}")

              # Add canonical URL (jidonglab.com)
              slug = basename.replace("-en.md", "").replace(".md", "")
              canonical = f"https://jidonglab.com/blog/{slug}-ko"

              # Add footer
              footer = f"\n\n---\n\n*Originally published at [Jidong Lab]({canonical})*"

              payload = {
                  "title": title,
                  "contentFormat": "markdown",
                  "content": body_md + footer,
                  "tags": tags,
                  "canonicalUrl": canonical,
                  "publishStatus": "draft",  # Medium API: draft first, review on Medium
              }

              data = json.dumps(payload).encode()
              req = urllib.request.Request(
                  f"https://api.medium.com/v1/users/{user_id}/posts",
                  data=data, method="POST", headers=HEADERS,
              )

              try:
                  resp = urllib.request.urlopen(req)
                  result = json.loads(resp.read())["data"]
                  medium_url = result.get("url", "")
                  print(f"  -> Draft created: {medium_url}")

                  # Write medium_url back to file
                  new_fm = fm.rstrip() + f"\nmedium_url: '{medium_url}'\n"
                  with open(filepath, "w") as f:
                      f.write("---" + new_fm + "---" + parts[2])
                  published += 1
              except urllib.error.HTTPError as e:
                  body = e.read().decode()
                  print(f"  -> Failed: HTTP {e.code}: {body[:300]}")
              except Exception as e:
                  print(f"  -> Failed: {e}")

              time.sleep(5)

          print(f"\nDone: {published} published, {skipped} skipped")

          PYEOF
      - name: Commit medium URLs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posts/*.md
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: add Medium URLs [skip ci]"
            git push
          fi
