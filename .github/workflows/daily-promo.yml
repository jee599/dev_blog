name: Daily ContextZip Promo
on:
  schedule:
    - cron: '0 14 * * *'  # 2 PM UTC = 11 PM KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish today's post
        env:
          DEVTO_TOKEN: ${{ secrets.DEVTO_TOKEN }}
        run: |
          DAY_OF_YEAR=$(date +%-j)
          DAY=$(( (DAY_OF_YEAR % 30) + 1 ))
          DAY_PADDED=$(printf "%02d" $DAY)
          SRC="scheduled/day-${DAY_PADDED}.md"

          if [ ! -f "$SRC" ]; then
            echo "No post for day $DAY_PADDED"
            exit 0
          fi

          DEST="posts/contextzip-promo-${DAY_PADDED}-en.md"

          if [ -f "$DEST" ]; then
            echo "Already published: $DEST"
            exit 0
          fi

          cp "$SRC" "$DEST"
          sed -i 's/published: false/published: true/' "$DEST"

          # Commit
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          git commit -m "promo: day ${DAY_PADDED} contextzip post" || exit 0
          git push

          # Publish to DEV.to directly
          python3 - "$DEST" <<'PYEOF'
          import sys, os, json, re, urllib.request

          api_key = os.environ.get("DEVTO_TOKEN", "")
          if not api_key:
              print("No DEVTO_TOKEN")
              sys.exit(0)

          filepath = sys.argv[1]
          with open(filepath) as f:
              content = f.read()

          parts = content.split("---", 2)
          if len(parts) < 3:
              sys.exit(1)

          fm, body = parts[1], parts[2].strip()
          title_m = re.search(r'^title:\s*"?(.+?)"?\s*$', fm, re.M)
          title = title_m.group(1) if title_m else "Untitled"
          tags = re.findall(r'^\s+-\s+(\w+)', fm, re.M)[:4]

          data = json.dumps({"article": {
              "title": title,
              "body_markdown": body,
              "published": True,
              "tags": tags,
              "series": "ContextZip Daily"
          }}).encode()

          req = urllib.request.Request(
              "https://dev.to/api/articles",
              data=data,
              headers={"api-key": api_key, "Content-Type": "application/json"}
          )
          try:
              resp = urllib.request.urlopen(req)
              result = json.loads(resp.read())
              print(f"Published: {result.get('url', '?')}")
          except urllib.error.HTTPError as e:
              print(f"HTTP {e.code}: {e.read().decode()}")
          PYEOF
