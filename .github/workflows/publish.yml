name: Publish to DEV.to
on:
  push:
    branches: [main]
    paths:
      - 'posts/*.md'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish articles to DEV.to
        env:
          DEVTO_KEY: ${{ secrets.DEVTO_TOKEN }}
        run: |
          python3 << 'PYEOF'
          import os, json, re, glob, time, urllib.request, urllib.error

          api_key = os.environ["DEVTO_KEY"]
          published = 0
          failed = 0

          for filepath in sorted(glob.glob("posts/*.md")):
              with open(filepath) as f:
                  content = f.read()

              if re.search(r"^id:\s*\d+", content, re.M):
                  print(f"SKIP: {filepath}")
                  continue

              print(f"\nPUBLISHING: {filepath}")

              parts = content.split("---", 2)
              if len(parts) < 3:
                  print(f"  ERROR: bad frontmatter")
                  failed += 1
                  continue

              fm = parts[1]
              body = parts[2].strip()

              m = re.search(r'^title:\s*["\']?(.*?)["\']?\s*$', fm, re.M)
              title = m.group(1) if m else ""
              m = re.search(r'^description:\s*["\']?(.*?)["\']?\s*$', fm, re.M)
              desc = m.group(1) if m else ""
              tags = re.findall(r'^\s*-\s*(\w+)', fm, re.M)

              print(f"  title: {title}")
              print(f"  tags: {tags}")

              data = json.dumps({
                  "article": {
                      "title": title,
                      "body_markdown": body,
                      "description": desc,
                      "published": True,
                      "tags": tags[:4]
                  }
              }).encode()

              # Retry up to 3 times with backoff
              for attempt in range(3):
                  req = urllib.request.Request(
                      "https://dev.to/api/articles",
                      data=data,
                      headers={
                          "api-key": api_key,
                          "Content-Type": "application/json"
                      }
                  )
                  try:
                      resp = urllib.request.urlopen(req)
                      result = json.loads(resp.read())
                      aid = result["id"]
                      pub_date = result.get("published_at", "")
                      print(f"  OK id={aid}")

                      new_fm = fm.rstrip() + f"\nid: {aid}\ndate: '{pub_date}'\n"
                      with open(filepath, "w") as f:
                          f.write("---" + new_fm + "---" + parts[2])
                      published += 1
                      break
                  except urllib.error.HTTPError as e:
                      err = e.read().decode()
                      print(f"  attempt {attempt+1} FAIL (HTTP {e.code}): {err[:200]}")
                      if e.code == 429:
                          wait = 30 * (attempt + 1)
                          print(f"  rate limited, waiting {wait}s...")
                          time.sleep(wait)
                      else:
                          failed += 1
                          break
                  except Exception as e:
                      print(f"  attempt {attempt+1} ERROR: {e}")
                      failed += 1
                      break
              else:
                  failed += 1

              time.sleep(15)

          print(f"\nDone: {published} published, {failed} failed")
          if failed > 0:
              exit(1)
          PYEOF
      - name: Commit article IDs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posts/*.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update published articles [skip ci]"
            git push
          fi
