name: Publish to DEV.to
on:
  push:
    branches: [main]
    paths:
      - 'posts/*.md'
      - '.github/workflows/publish.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish articles to DEV.to
        env:
          DEVTO_KEY: ${{ secrets.DEVTO_TOKEN }}
        run: |
          python3 << 'PYEOF'
          import os, json, re, glob, time, random, urllib.request, urllib.error

          api_key = os.environ["DEVTO_KEY"]
          BASE = "https://dev.to/api"
          HEADERS = {
              "api-key": api_key,
              "Content-Type": "application/json",
              "Accept": "application/vnd.forem.api-v1+json",
              "User-Agent": "dev-blog-publisher/1.0 (GitHub Actions)",
          }

          # Retry config
          MAX_RETRIES = 4
          BASE_DELAY = 15  # seconds
          BETWEEN_POSTS = 35  # seconds between posts

          published = 0
          failed = 0
          log_lines = []

          def log(msg):
              print(msg)
              log_lines.append(msg)

          def api_call(method, url, payload=None, retries=MAX_RETRIES):
              """Make an API call with retry + exponential backoff + jitter."""
              for attempt in range(retries + 1):
                  data = json.dumps(payload).encode("utf-8") if payload else None
                  req = urllib.request.Request(url, data=data, method=method, headers=HEADERS)
                  try:
                      resp = urllib.request.urlopen(req)
                      body = json.loads(resp.read())
                      return resp.status, body, dict(resp.headers)
                  except urllib.error.HTTPError as e:
                      code = e.code
                      raw = e.read().decode("utf-8", errors="replace")
                      resp_headers = dict(e.headers) if e.headers else {}

                      # Log full error details
                      log(f"    attempt {attempt+1}: HTTP {code}")
                      log(f"    response body: {raw[:500]}")
                      rate_remaining = resp_headers.get("x-ratelimit-remaining", "?")
                      rate_reset = resp_headers.get("x-ratelimit-reset", "?")
                      retry_after = resp_headers.get("retry-after", "?")
                      log(f"    rate-limit-remaining={rate_remaining}  reset={rate_reset}  retry-after={retry_after}")

                      # Retry on 403, 429, or 5xx
                      if code in (403, 429) or code >= 500:
                          if attempt < retries:
                              delay = BASE_DELAY * (2 ** attempt) + random.uniform(1, 5)
                              log(f"    retrying in {delay:.1f}s ...")
                              time.sleep(delay)
                              continue
                      # Non-retryable or out of retries
                      return code, raw, resp_headers
                  except Exception as exc:
                      log(f"    attempt {attempt+1}: exception {exc}")
                      if attempt < retries:
                          delay = BASE_DELAY * (2 ** attempt) + random.uniform(1, 5)
                          time.sleep(delay)
                          continue
                      return 0, str(exc), {}
              return 0, "max retries exhausted", {}

          # ── Fetch existing articles to detect duplicates ──
          existing_titles = set()
          existing_map = {}  # title -> article dict
          log("Fetching existing articles from DEV.to ...")
          page = 1
          while True:
              code, body, _ = api_call("GET", f"{BASE}/articles/me?per_page=100&page={page}")
              if code != 200 or not isinstance(body, list) or len(body) == 0:
                  if code != 200:
                      log(f"  Warning: /articles/me returned HTTP {code}: {str(body)[:200]}")
                  break
              for art in body:
                  t = art.get("title", "").strip()
                  existing_titles.add(t)
                  existing_map[t] = art
              if len(body) < 100:
                  break
              page += 1
          log(f"  Found {len(existing_titles)} existing article(s) on DEV.to\n")

          # ── Process each markdown file ──
          for filepath in sorted(glob.glob("posts/*.md")):
              # Skip build-log posts and Korean posts
              fname = os.path.basename(filepath)
              if "build-log" in fname:
                  log(f"SKIP (build-log): {filepath}")
                  continue
              if fname.endswith("-ko.md"):
                  log(f"SKIP (korean filename): {filepath}")
                  continue

              with open(filepath) as f:
                  content = f.read()

              # Skip if title contains Korean characters
              m_title = re.search(r'^title:\s*["\']?(.*?)["\']?\s*$', content, re.M)
              if m_title and any('\uac00' <= c <= '\ud7a3' for c in m_title.group(1)):
                  log(f"SKIP (korean title): {filepath}")
                  continue

              m_id = re.search(r"^id:\s*(\d+)", content, re.M)
              m_pub = re.search(r"^published:\s*(true|false)\s*$", content, re.M | re.I)
              m_date = re.search(r"^date:\s*[\'\"]?(.*?)[\'\"]?\s*$", content, re.M)
              has_id = bool(m_id)
              should_publish = (m_pub.group(1).lower() == "true") if m_pub else False
              current_date = (m_date.group(1).strip() if m_date else "")

              if has_id and not (should_publish and current_date == "draft"):
                  log(f"SKIP (has id): {filepath}")
                  continue

              log(f"\nPUBLISHING: {filepath}")

              parts = content.split("---", 2)
              if len(parts) < 3:
                  log(f"  ERROR: bad frontmatter")
                  failed += 1
                  continue

              fm = parts[1]
              body_md = parts[2].strip()

              m = re.search(r'^title:\s*["\']?(.*?)["\']?\s*$', fm, re.M)
              title = m.group(1).strip() if m else ""
              m = re.search(r'^description:\s*["\']?(.*?)["\']?\s*$', fm, re.M)
              desc = m.group(1).strip() if m else ""
              tags = re.findall(r'^\s*-\s*(\w+)', fm, re.M)

              log(f"  title: {title}")
              log(f"  tags: {tags}")

              if has_id and should_publish and current_date == "draft":
                  aid = int(m_id.group(1))
                  log(f"  draft detected (id={aid}) -> publish update")
                  code2, result2, _ = api_call("PUT", f"{BASE}/articles/{aid}", {
                      "article": {
                          "published": True,
                          "title": title,
                          "body_markdown": body_md,
                          "description": desc,
                          "tags": tags[:4],
                      }
                  })
                  log(f"  publish draft result: HTTP {code2}")
                  if code2 in (200, 201):
                      pub_date = result2.get("published_at") or result2.get("published_timestamp") or ""
                      fm2 = re.sub(r"^date:\s*.*$", f"date: '{pub_date}'", fm, flags=re.M)
                      with open(filepath, "w") as f:
                          f.write("---" + fm2 + "---" + parts[2])
                      log(f"  PUBLISHED existing draft id={aid}")
                      published += 1
                  else:
                      log(f"  FAILED publish existing draft id={aid}: {str(result2)[:300]}")
                      failed += 1
                  time.sleep(BETWEEN_POSTS)
                  continue

              # ── Check for duplicate ──
              if title in existing_titles:
                  art = existing_map[title]
                  aid = art["id"]
                  pub_date = art.get("published_at", "")
                  log(f"  DUPLICATE found on DEV.to (id={aid}) — writing id to file")
                  new_fm = fm.rstrip() + f"\nid: {aid}\ndate: '{pub_date}'\n"
                  with open(filepath, "w") as f:
                      f.write("---" + new_fm + "---" + parts[2])
                  published += 1
                  continue

              # ── Step 1: Create as DRAFT ──
              log(f"  step 1: creating draft ...")
              code, result, hdrs = api_call("POST", f"{BASE}/articles", {
                  "article": {
                      "title": title,
                      "body_markdown": body_md,
                      "description": desc,
                      "published": False,
                      "tags": tags[:4],
                  }
              })
              log(f"  step 1 result: HTTP {code}")

              if code != 201:
                  log(f"  FAILED to create draft: {str(result)[:300]}")
                  failed += 1
                  time.sleep(BETWEEN_POSTS)
                  continue

              aid = result["id"]
              log(f"  draft created id={aid}")

              # ── Step 2: Do NOT auto-publish ──
              # We intentionally stop at draft creation so the user can review on DEV.to
              # and publish manually when ready.
              log(f"  DRAFT saved id={aid} (manual publish)")
              new_fm = fm.rstrip() + f"\nid: {aid}\ndate: 'draft'\n"
              with open(filepath, "w") as f:
                  f.write("---" + new_fm + "---" + parts[2])
              published += 1

              time.sleep(BETWEEN_POSTS)

          log(f"\nDone: {published} published, {failed} failed")
          with open("publish-log.txt", "w") as f:
              f.write("\n".join(log_lines))
          if failed > 0:
              exit(1)
          PYEOF
      - name: Commit results
        if: always()
        run: |
          if [ -f publish-log.txt ]; then
            echo "=== Publish Log ==="
            cat publish-log.txt
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posts/*.md
          git add -f publish-log.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update published articles [skip ci]"
            git push
          fi
