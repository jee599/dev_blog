name: Publish to DEV.to
on:
  push:
    branches: [main]
    paths:
      - 'posts/*.md'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish articles to DEV.to
        env:
          DEVTO_KEY: ${{ secrets.DEVTO_TOKEN }}
        run: |
          python3 << 'PYEOF'
          import os, json, re, glob, time, urllib.request, urllib.error

          api_key = os.environ["DEVTO_KEY"]
          published_count = 0

          for filepath in sorted(glob.glob("posts/*.md")):
              with open(filepath) as f:
                  content = f.read()

              # Check if already has id
              if re.search(r"^id:\s*\d+", content, re.M):
                  print(f"SKIP: {filepath} (already published)")
                  continue

              print(f"\n=== PUBLISHING: {filepath} ===")

              # Parse frontmatter
              parts = content.split("---", 2)
              if len(parts) < 3:
                  print(f"  ERROR: invalid frontmatter")
                  continue

              fm = parts[1]
              body = parts[2].strip()

              # Extract title
              m = re.search(r'^title:\s*["\']?(.*?)["\']?\s*$', fm, re.M)
              title = m.group(1) if m else ""

              # Extract description
              m = re.search(r'^description:\s*["\']?(.*?)["\']?\s*$', fm, re.M)
              desc = m.group(1) if m else ""

              # Extract tags
              tags = re.findall(r'^\s*-\s*(\w+)', fm, re.M)

              print(f"  Title: {title}")
              print(f"  Desc: {desc[:60]}...")
              print(f"  Tags: {tags}")
              print(f"  Body: {len(body)} chars")

              # API call
              article_data = json.dumps({
                  "article": {
                      "title": title,
                      "body_markdown": body,
                      "description": desc,
                      "published": True,
                      "tags": tags[:4]
                  }
              }).encode()

              req = urllib.request.Request(
                  "https://dev.to/api/articles",
                  data=article_data,
                  headers={
                      "api-key": api_key,
                      "Content-Type": "application/json"
                  }
              )

              try:
                  resp = urllib.request.urlopen(req)
                  result = json.loads(resp.read())
                  article_id = result["id"]
                  pub_date = result.get("published_at", "")
                  print(f"  SUCCESS! id={article_id}")

                  # Write id and date back to frontmatter
                  new_fm = fm.rstrip() + f"\nid: {article_id}\ndate: '{pub_date}'\n"
                  new_content = "---" + new_fm + "---" + parts[2]
                  with open(filepath, "w") as f:
                      f.write(new_content)

                  published_count += 1

              except urllib.error.HTTPError as e:
                  error_body = e.read().decode()
                  print(f"  FAILED (HTTP {e.code}): {error_body[:300]}")

              # Rate limit
              print("  Waiting 15s...")
              time.sleep(15)

          print(f"\n=== Done: {published_count} articles published ===")
          PYEOF
      - name: Commit article IDs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posts/*.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update published articles [skip ci]"
            git push
          fi
