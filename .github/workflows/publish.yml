name: Publish to DEV.to
on:
  push:
    branches: [main]
    paths:
      - 'posts/*.md'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish articles to DEV.to
        env:
          DEVTO_KEY: ${{ secrets.DEVTO_TOKEN }}
        run: |
          python3 << 'PYEOF'
          import os, json, re, glob, time, urllib.request, urllib.error

          api_key = os.environ["DEVTO_KEY"]
          published = 0
          failed = 0
          log_lines = []

          def log(msg):
              print(msg)
              log_lines.append(msg)

          for filepath in sorted(glob.glob("posts/*.md")):
              with open(filepath) as f:
                  content = f.read()

              if re.search(r"^id:\s*\d+", content, re.M):
                  log(f"SKIP: {filepath}")
                  continue

              log(f"\nPUBLISHING: {filepath}")

              parts = content.split("---", 2)
              if len(parts) < 3:
                  log(f"  ERROR: bad frontmatter")
                  failed += 1
                  continue

              fm = parts[1]
              body = parts[2].strip()

              m = re.search(r'^title:\s*["\']?(.*?)["\']?\s*$', fm, re.M)
              title = m.group(1) if m else ""
              m = re.search(r'^description:\s*["\']?(.*?)["\']?\s*$', fm, re.M)
              desc = m.group(1) if m else ""
              tags = re.findall(r'^\s*-\s*(\w+)', fm, re.M)

              log(f"  title: {title}")
              log(f"  desc: {desc}")
              log(f"  tags: {tags}")
              log(f"  body_len: {len(body)}")

              payload = {
                  "article": {
                      "title": title,
                      "body_markdown": body,
                      "description": desc,
                      "published": True,
                      "tags": tags[:4]
                  }
              }
              data = json.dumps(payload).encode("utf-8")

              for attempt in range(3):
                  req = urllib.request.Request(
                      "https://dev.to/api/articles",
                      data=data,
                      headers={
                          "api-key": api_key,
                          "Content-Type": "application/json; charset=utf-8"
                      }
                  )
                  try:
                      resp = urllib.request.urlopen(req)
                      result = json.loads(resp.read())
                      aid = result["id"]
                      pub_date = result.get("published_at", "")
                      log(f"  OK id={aid}")

                      new_fm = fm.rstrip() + f"\nid: {aid}\ndate: '{pub_date}'\n"
                      with open(filepath, "w") as f:
                          f.write("---" + new_fm + "---" + parts[2])
                      published += 1
                      break
                  except urllib.error.HTTPError as e:
                      err = e.read().decode()
                      hdrs = dict(e.headers)
                      log(f"  attempt {attempt+1} HTTP {e.code}: {err[:500]}")
                      log(f"  headers: {json.dumps({k:v for k,v in hdrs.items() if 'rate' in k.lower() or 'retry' in k.lower()})}")
                      if e.code in (429, 403):
                          wait = 60 * (attempt + 1)
                          log(f"  rate limited, wait {wait}s")
                          time.sleep(wait)
                      else:
                          failed += 1
                          break
                  except Exception as e:
                      log(f"  attempt {attempt+1} ERR: {str(e)[:300]}")
                      failed += 1
                      break
              else:
                  failed += 1

              time.sleep(15)

          summary = f"Done: {published} published, {failed} failed"
          log(summary)

          # Write log to file for debugging
          with open("publish-log.txt", "w") as f:
              f.write("\n".join(log_lines))

          if failed > 0:
              exit(1)
          PYEOF
      - name: Commit results
        if: always()
        run: |
          if [ -f publish-log.txt ]; then
            echo "=== Publish Log ==="
            cat publish-log.txt
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posts/*.md
          git add -f publish-log.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update published articles [skip ci]"
            git push
          fi
