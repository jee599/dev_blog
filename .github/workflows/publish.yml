name: Publish to DEV.to
on:
  push:
    branches: [main]
    paths:
      - 'posts/*.md'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish articles to DEV.to
        env:
          DEVTO_KEY: ${{ secrets.DEVTO_TOKEN }}
        run: |
          python3 << 'PYEOF'
          import os, json, re, glob, time, urllib.request, urllib.error

          api_key = os.environ["DEVTO_KEY"]
          published = 0
          failed = 0
          log_lines = []

          def log(msg):
              print(msg)
              log_lines.append(msg)

          def api_call(method, url, payload=None):
              data = json.dumps(payload).encode("utf-8") if payload else None
              req = urllib.request.Request(url, data=data, method=method,
                  headers={"api-key": api_key, "Content-Type": "application/json"})
              try:
                  resp = urllib.request.urlopen(req)
                  return resp.status, json.loads(resp.read())
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode()

          for filepath in sorted(glob.glob("posts/*.md")):
              with open(filepath) as f:
                  content = f.read()

              if re.search(r"^id:\s*\d+", content, re.M):
                  log(f"SKIP: {filepath}")
                  continue

              log(f"\nPUBLISHING: {filepath}")

              parts = content.split("---", 2)
              if len(parts) < 3:
                  log(f"  ERROR: bad frontmatter")
                  failed += 1
                  continue

              fm = parts[1]
              body = parts[2].strip()

              m = re.search(r'^title:\s*["\']?(.*?)["\']?\s*$', fm, re.M)
              title = m.group(1) if m else ""
              m = re.search(r'^description:\s*["\']?(.*?)["\']?\s*$', fm, re.M)
              desc = m.group(1) if m else ""
              tags = re.findall(r'^\s*-\s*(\w+)', fm, re.M)

              log(f"  title: {title}")
              log(f"  tags: {tags}")

              # Step 1: Create as DRAFT
              log(f"  step1: creating draft...")
              code, result = api_call("POST", "https://dev.to/api/articles", {
                  "article": {
                      "title": title,
                      "body_markdown": body,
                      "description": desc,
                      "published": False,
                      "tags": tags[:4]
                  }
              })
              log(f"  step1 result: HTTP {code}")

              if code != 201:
                  log(f"  step1 error: {str(result)[:300]}")
                  failed += 1
                  time.sleep(15)
                  continue

              aid = result["id"]
              log(f"  draft created id={aid}")
              time.sleep(5)

              # Step 2: Update to PUBLISHED
              log(f"  step2: publishing...")
              code2, result2 = api_call("PUT", f"https://dev.to/api/articles/{aid}", {
                  "article": {"published": True}
              })
              log(f"  step2 result: HTTP {code2}")

              if code2 == 200:
                  pub_date = result2.get("published_at", "")
                  log(f"  PUBLISHED! id={aid}")
                  new_fm = fm.rstrip() + f"\nid: {aid}\ndate: '{pub_date}'\n"
                  with open(filepath, "w") as f:
                      f.write("---" + new_fm + "---" + parts[2])
                  published += 1
              else:
                  log(f"  step2 error: {str(result2)[:300]}")
                  # Still save draft id
                  new_fm = fm.rstrip() + f"\nid: {aid}\n"
                  with open(filepath, "w") as f:
                      f.write("---" + new_fm + "---" + parts[2])
                  published += 1
                  log(f"  saved as draft id={aid}")

              time.sleep(30)

          log(f"\nDone: {published} published, {failed} failed")
          with open("publish-log.txt", "w") as f:
              f.write("\n".join(log_lines))
          if failed > 0:
              exit(1)
          PYEOF
      - name: Commit results
        if: always()
        run: |
          if [ -f publish-log.txt ]; then
            echo "=== Log ==="
            cat publish-log.txt
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posts/*.md
          git add -f publish-log.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update published articles [skip ci]"
            git push
          fi
