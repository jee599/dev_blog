name: Publish to Blogger

on:
  push:
    branches: [main]
    paths:
      - 'posts/*-ko.md'
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish Korean posts to Blogger
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          python3 << 'PYEOF'
          import os, json, re, glob, time, urllib.request, urllib.error, urllib.parse
          from html import escape as html_escape

          blog_id = os.environ.get("BLOGGER_BLOG_ID", "")
          client_id = os.environ.get("GOOGLE_CLIENT_ID", "")
          client_secret = os.environ.get("GOOGLE_CLIENT_SECRET", "")
          refresh_token = os.environ.get("GOOGLE_REFRESH_TOKEN", "")

          if not all([blog_id, client_id, client_secret, refresh_token]):
              print("Blogger secrets not set, skipping")
              exit(0)

          # Get access token from refresh token
          token_data = urllib.parse.urlencode({
              "client_id": client_id,
              "client_secret": client_secret,
              "refresh_token": refresh_token,
              "grant_type": "refresh_token",
          }).encode()

          req = urllib.request.Request("https://oauth2.googleapis.com/token", data=token_data, method="POST")
          try:
              resp = urllib.request.urlopen(req)
              tokens = json.loads(resp.read())
              access_token = tokens["access_token"]
              print("Access token refreshed successfully")
          except Exception as e:
              print(f"Token refresh failed: {e}")
              exit(1)

          HEADERS = {
              "Authorization": f"Bearer {access_token}",
              "Content-Type": "application/json",
              "User-Agent": "dev-blog-publisher/1.0",
          }

          def md_to_html(md):
              lines = md.split('\n')
              html_lines = []
              in_code = False
              code_buf = []

              for line in lines:
                  if line.startswith('```'):
                      if in_code:
                          html_lines.append(f'<pre style="background:#1e1e2e;color:#cdd6f4;padding:16px;border-radius:8px;overflow-x:auto;font-family:monospace;font-size:14px;line-height:1.5;"><code>{chr(10).join(html_escape(l) for l in code_buf)}</code></pre>')
                          code_buf = []
                          in_code = False
                      else:
                          in_code = True
                      continue

                  if in_code:
                      code_buf.append(line)
                      continue

                  if line.startswith('## '):
                      html_lines.append(f'<h2 style="margin-top:2em;margin-bottom:0.5em;font-size:1.4em;">{line[3:]}</h2>')
                  elif line.startswith('### '):
                      html_lines.append(f'<h3 style="margin-top:1.5em;margin-bottom:0.5em;font-size:1.2em;">{line[4:]}</h3>')
                  elif line.startswith('> '):
                      html_lines.append(f'<blockquote style="border-left:4px solid #00c471;padding:8px 16px;margin:16px 0;color:#555;background:#f9fafb;">{line[2:]}</blockquote>')
                  elif re.match(r'!\[([^\]]*)\]\(([^)]+)\)', line):
                      m = re.match(r'!\[([^\]]*)\]\(([^)]+)\)', line)
                      html_lines.append(f'<img src="{m.group(2)}" alt="{html_escape(m.group(1))}" style="max-width:100%;border-radius:8px;margin:16px 0;" />')
                  elif line.strip() == '':
                      html_lines.append('')
                  elif line.startswith('---'):
                      html_lines.append('<hr style="margin:2em 0;border:none;border-top:1px solid #eee;" />')
                  else:
                      processed = line
                      processed = re.sub(r'\*\*(.+?)\*\*', r'<strong>\1</strong>', processed)
                      processed = re.sub(r'`([^`]+)`', r'<code style="background:#f0f0f0;padding:2px 6px;border-radius:4px;font-size:0.9em;">\1</code>', processed)
                      processed = re.sub(r'\[([^\]]+)\]\(([^)]+)\)', r'<a href="\2" style="color:#00c471;">\1</a>', processed)
                      html_lines.append(f'<p style="line-height:1.8;margin:8px 0;">{processed}</p>')

              return '\n'.join(html_lines)

          # Get existing posts to avoid duplicates
          existing_titles = set()
          try:
              req = urllib.request.Request(
                  f"https://www.googleapis.com/blogger/v3/blogs/{blog_id}/posts?maxResults=100",
                  headers=HEADERS
              )
              resp = urllib.request.urlopen(req)
              data = json.loads(resp.read())
              for post in data.get("items", []):
                  existing_titles.add(post["title"].strip())
              print(f"Existing Blogger posts: {len(existing_titles)}")
          except Exception as e:
              print(f"Warning: couldn't fetch existing posts: {e}")

          published = 0
          skipped = 0

          for filepath in sorted(glob.glob("posts/*-ko.md")):
              basename = os.path.basename(filepath)

              if "build-log" in basename:
                  continue

              with open(filepath) as f:
                  content = f.read()

              if "blogger_url:" in content:
                  skipped += 1
                  continue

              parts = content.split("---", 2)
              if len(parts) < 3:
                  continue

              fm = parts[1]
              body_md = parts[2].strip()

              if len(body_md) < 100:
                  continue

              m = re.search(r'^title:\s*["\']?(.*?)["\']?\s*$', fm, re.M)
              title = m.group(1).strip() if m else ""
              if not title:
                  continue

              if title in existing_titles:
                  skipped += 1
                  continue

              m = re.search(r'^published:\s*(true|false)', fm, re.M | re.I)
              if m and m.group(1).lower() != "true":
                  continue

              m = re.search(r'^tags:\s*(.*?)$', fm, re.M)
              tags_str = m.group(1).strip() if m else ""
              tags = [t.strip().strip("'\"") for t in re.split(r'[,\[\]]', tags_str) if t.strip().strip("'\"")][:5]

              print(f"\nPUBLISHING to Blogger: {title[:60]}")

              body_html = md_to_html(body_md)

              slug = basename.replace("-ko.md", "").replace(".md", "")
              canonical = f"https://jidonglab.com/blog/{slug}-ko"
              body_html += f'\n<br/><hr style="margin:2em 0;border:none;border-top:1px solid #eee;" />\n<p style="color:#888;font-size:0.9em;">원문: <a href="{canonical}" style="color:#00c471;">Jidong Lab</a></p>'

              payload = {
                  "kind": "blogger#post",
                  "blog": {"id": blog_id},
                  "title": title,
                  "content": body_html,
                  "labels": tags if tags else ["AI"],
              }

              data = json.dumps(payload).encode()
              url = f"https://www.googleapis.com/blogger/v3/blogs/{blog_id}/posts"
              req = urllib.request.Request(url, data=data, method="POST", headers=HEADERS)

              try:
                  resp = urllib.request.urlopen(req)
                  result = json.loads(resp.read())
                  blogger_url = result.get("url", "")
                  blogger_id = result.get("id", "")
                  print(f"  -> Published: {blogger_url}")

                  new_fm = fm.rstrip() + f"\nblogger_url: '{blogger_url}'\nblogger_id: '{blogger_id}'\n"
                  with open(filepath, "w") as f:
                      f.write("---" + new_fm + "---" + parts[2])
                  published += 1
                  existing_titles.add(title)
              except urllib.error.HTTPError as e:
                  body = e.read().decode()
                  print(f"  -> Failed: HTTP {e.code}: {body[:300]}")
              except Exception as e:
                  print(f"  -> Failed: {e}")

              time.sleep(3)

          print(f"\nDone: {published} published, {skipped} skipped")

          PYEOF
      - name: Commit blogger URLs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posts/*.md
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: add Blogger URLs [skip ci]"
            git push
          fi
